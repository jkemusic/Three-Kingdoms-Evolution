<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三國殺重製版</title>
<style>

:root{
  --bg:#0e1319; --bg2:#141b23; --panel:#18212b; --panel2:#212c39; --line:#2c3a4a; --text:#eaeef3; --dim:#8c9bad;
  --red:#ef5b55; --black:#c3ccd8; --gold:#e9bf62; --green:#53c98a; --blue:#6aaeff; --accent:#e9bf62;
  --felt1:#1f5a46; --felt2:#0f2f27; --wood:#5b3a22; --wood2:#2d1c10;
  --shadow:0 6px 16px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 0%,#17222d 0,var(--bg) 60%);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2f3d4e;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);transform:translateY(-1px)}
button.primary{background:linear-gradient(180deg,#f2cd77,#d9a63f);color:#2a1d04;border-color:#f2cd77;font-weight:700;box-shadow:0 2px 8px rgba(233,191,98,.3)}
button:disabled{opacity:.4;cursor:default;transform:none}
select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
input[type=range]{accent-color:var(--accent);padding:0}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
#top{display:flex;gap:10px;align-items:center;padding:9px 16px;background:rgba(24,33,43,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.35);z-index:3}
#top .title{font-weight:800;font-size:18px;letter-spacing:.15em;color:var(--accent);margin-right:10px;text-shadow:0 0 12px rgba(233,191,98,.35)}
#top label{color:var(--dim);display:flex;align-items:center;gap:6px}
#status{margin-left:0;color:var(--dim);background:var(--panel2);padding:3px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px}
#mid{display:grid;grid-template-columns:1fr 390px;min-height:0}
#tablewrap{position:relative;min-height:0;overflow:hidden;margin:12px}
#tablewrap::before{content:"";position:absolute;inset:6% 5%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,var(--felt1) 0,var(--felt2) 78%);
  border:14px solid var(--wood);box-shadow:0 0 0 3px #7b5233,0 0 0 6px var(--wood2),inset 0 0 60px rgba(0,0,0,.65),0 18px 40px rgba(0,0,0,.55)}
#tablewrap::after{content:"";position:absolute;inset:6% 5%;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(233,191,98,.18);margin:26px;pointer-events:none}
#table{position:absolute;inset:0}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#a9c4b8;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#roundtag{position:absolute;left:12px;top:10px;z-index:4;pointer-events:none;font-size:22px;font-weight:800;letter-spacing:.15em;color:var(--accent);text-shadow:0 0 14px rgba(63,210,255,.7)}
#roundtag:empty{display:none}
#roundtag .rtdeck{font-size:14px;letter-spacing:.05em;font-weight:600;color:#9eeaff;margin-top:2px}
#center .big{font-size:30px;color:var(--gold);font-weight:800;letter-spacing:.2em}
#winner{margin-top:10px;font-size:24px;color:#fff;font-weight:800;background:rgba(0,0,0,.45);padding:6px 20px;border-radius:99px;border:1px solid var(--gold)}
.pl{position:absolute;transform:translate(-50%,-50%);width:236px;background:linear-gradient(160deg,rgba(33,44,57,.96),rgba(20,28,37,.96));border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:8px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.pl:hover{border-color:#44586f}
.pl.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(233,191,98,.25),0 0 24px rgba(233,191,98,.5);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(233,191,98,.15),0 0 32px rgba(233,191,98,.65)}}
.pl.dead{opacity:.4;filter:grayscale(1)}
.pl.sel{outline:2px solid var(--blue);outline-offset:2px}
.pl.target{border-color:var(--green);box-shadow:0 0 0 2px rgba(83,201,138,.35),0 0 20px rgba(83,201,138,.5)}
.pl .ph{width:66px;height:94px;border-radius:8px;background:#0b0e12 center/cover no-repeat;flex:none;border:2px solid #34455a;box-shadow:inset 0 0 8px rgba(0,0,0,.5)}
.pl .inf{min-width:0;flex:1}
.pl .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{display:inline-block;padding:0 8px;border-radius:99px;font-size:11px;font-weight:700;margin-left:5px;background:#394150;color:#fff;vertical-align:1px}
.role.主公{background:linear-gradient(#e0504a,#9c2824)}.role.忠臣{background:linear-gradient(#e8bc2e,#a9801a);color:#2b2000}.role.反賊{background:linear-gradient(#3fb86f,#217a47)}.role.內奸{background:linear-gradient(#4a8be8,#2a5aa8)}
.hp{letter-spacing:1px;color:var(--red);font-size:14px;text-shadow:0 0 6px rgba(239,91,85,.4)}
.hp .e{color:#43343a;text-shadow:none}
.meta{color:var(--dim);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.tag{font-size:11px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tag.red{color:#ff9a95;border-color:#5a3434}.tag.blk{color:var(--black)}.tag.chain{color:var(--blue);border-color:#2c4a6e}.tag.flip{color:#d9a6ff;border-color:#523a6e}
.bubble{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:240px;background:#f4ecd6;color:#2b2415;border-radius:10px;padding:5px 10px;font-size:12px;pointer-events:none;z-index:5;box-shadow:var(--shadow)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#f4ecd6}
.mini{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.mini img{width:30px;height:43px;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:help}
.card{position:relative;width:108px;height:154px;border-radius:9px;border:2px solid #2a3544;background:#0d0f13;flex:none;overflow:hidden;cursor:default;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .lab{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px;text-align:center;padding:10px 1px 2px}
.card.red .lab{color:#ff9a95}.card.blk .lab{color:var(--black)}
.card.noimg{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;background:linear-gradient(160deg,#222c38,#141a22)}
.card.noimg.red{color:#ff9a95}.card.noimg.blk{color:var(--black)}
.card.ok{cursor:pointer;border-color:var(--green);box-shadow:0 0 12px rgba(83,201,138,.35),0 4px 10px rgba(0,0,0,.5)}
.card.ok:hover{transform:translateY(-14px) scale(1.05);box-shadow:0 0 18px rgba(83,201,138,.6),0 10px 18px rgba(0,0,0,.55);z-index:4}
.card.picked{border-color:var(--gold);transform:translateY(-20px) scale(1.06);box-shadow:0 0 18px var(--gold),0 10px 18px rgba(0,0,0,.55)}
.card .info{position:absolute;top:3px;right:3px;font-size:13px;line-height:1;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:help;z-index:2;opacity:.8}
.card:hover .info{opacity:1;background:var(--accent);color:#222}
#side{display:flex;flex-direction:column;border-left:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2));min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line);background:rgba(0,0,0,.15)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px;color:var(--dim);transform:none}
#tabs button.on{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);font-weight:700}
.pane{flex:1;overflow:auto;padding:10px;min-height:0;display:none}
.pane.on{display:block}
#log div{padding:2px 0 2px 8px;font-size:13px;white-space:pre-wrap;word-break:break-all;border-left:2px solid transparent}
#log .turn{color:var(--accent);margin-top:10px;font-weight:700;background:rgba(233,191,98,.08);border-left-color:var(--accent);padding:3px 8px;border-radius:0 6px 6px 0}
#log .chain{color:var(--dim)}
#log .dead{color:var(--red);font-weight:700;border-left-color:var(--red)}
.th{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.th .hd{font-size:12px;color:var(--dim)}
.th .ti{font-weight:600}
.th .rs{color:var(--gold);font-size:13px}
.th details{margin-top:3px;font-size:12px;color:var(--dim)}
.th table{border-collapse:collapse;width:100%;margin-top:3px}
.th td,.th th{border:1px solid var(--line);padding:1px 4px;text-align:left;font-weight:400}
.th .opt.chosen{color:var(--gold);font-weight:700}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px}
.cc img{width:100%;border-radius:6px}
#bottom{background:linear-gradient(180deg,rgba(24,33,43,.95),#10161d);border-top:1px solid var(--line);padding:6px 16px 10px;min-height:200px;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
#hand{display:flex;justify-content:safe center;gap:12px;align-items:flex-end;min-height:176px;overflow-x:auto;padding:24px 4px 6px}
#bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;min-height:36px}
#bar .pr{color:var(--gold);margin-right:8px;font-weight:600}
#cardinfo .modal{z-index:40;align-items:center}
.ci{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--accent);color:var(--text);border-radius:14px;padding:16px;display:flex;gap:16px;max-width:min(94vw,560px);align-items:flex-start;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.ci img{width:200px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.ci h3{margin:0 0 6px;color:var(--accent);font-size:18px}.ci p{margin:0;line-height:1.7;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20}
.modal.soft{background:rgba(0,0,0,.15);backdrop-filter:none;align-items:flex-end;padding-bottom:240px}
.dlg{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;max-width:900px;max-height:90vh;overflow:auto;width:min(900px,94vw);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 10px;color:var(--accent)}
.modal.soft .dlg{max-height:calc(100vh - 320px);overflow-y:auto;pointer-events:auto;overscroll-behavior:contain}
.row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.err{background:#5a1f1f;color:#ffd0d0;padding:6px 12px}
#mnav{display:none}
body.hide-side #mid{grid-template-columns:1fr}
body.hide-side #side{display:none}
.zone{display:flex;flex-wrap:wrap;gap:4px;width:100%;margin-top:2px}.zone.jz{margin-top:3px}
.eq{position:relative;width:38px;height:54px;border-radius:4px;border:1px solid #3b4b5f;overflow:hidden;background:#0d0f13;box-shadow:0 2px 5px rgba(0,0,0,.5);cursor:help}
.eq img{width:100%;height:100%;object-fit:cover;display:block}
.eq .nm2{display:flex;height:100%;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.eq i{position:absolute;left:0;top:0;font-style:normal;font-size:10px;line-height:1;background:rgba(0,0,0,.75);color:var(--gold);padding:2px 3px;border-radius:0 0 4px 0}
.eq.jd{border-color:#b4403c;box-shadow:0 0 6px rgba(180,64,60,.6)}
.eq.jd i{color:#ff9a95}
.eq:hover{transform:scale(1.6);z-index:9}
#table.dense .eq{width:30px;height:43px}
#table{--hw:122px;--hh:100px}
#table.mid{--hw:116px;--hh:88px}
#table.mid .pl{width:224px}
#table.dense{--hw:96px;--hh:72px}
#table.dense .pl{width:184px;padding:5px;gap:6px}
#tablewrap:has(#table.dense)::before{border-radius:44px;inset:70px 150px}
#tablewrap:has(#table.dense)::after{display:none}
#table.dense .pl .ph{width:48px;height:68px}
#table.dense .pl .mini{display:none}
#table.dense .pl .nm{font-size:13px}
#bottom.spec{display:none}
#bottom.spec #hand{min-height:0;padding:0}
#hand:empty,#bottom.spec #hand{display:none!important}
/* ===== Master Duel 風格: 深藍底、青色發光邊框、斜角面板 ===== */
:root{
  --bg:#060b16; --bg2:#0a1424; --panel:#0c1830; --panel2:#12233f; --line:#1f4468; --text:#e9f3ff; --dim:#7f9bbd;
  --accent:#3fd2ff; --gold:#f0c95c; --green:#46e0a0; --blue:#3fd2ff; --red:#ff5d73;
  --felt1:#0f2a4a; --felt2:#050b17; --glow:0 0 14px rgba(63,210,255,.45);
}
html,body{background:radial-gradient(ellipse at 50% -10%,#10294a 0,#060b16 62%)}
#top{background:linear-gradient(90deg,rgba(8,20,40,.96),rgba(12,28,52,.96));border-bottom:1px solid #1f4468;box-shadow:0 1px 0 rgba(63,210,255,.25),0 4px 18px rgba(0,0,0,.5)}
#top .title{color:var(--accent);text-shadow:0 0 14px rgba(63,210,255,.6)}
button{border-radius:8px;padding:6px 20px;background:linear-gradient(180deg,#17304f,#0e1f38);border:0;box-shadow:inset 0 0 0 1px #2a5a85}
button:hover{box-shadow:inset 0 0 0 1px var(--accent),var(--glow);transform:none;background:linear-gradient(180deg,#1d3f66,#112846)}
button.primary{background:linear-gradient(180deg,#52dcff,#1a9bd0);color:#02202e;box-shadow:inset 0 0 0 1px #9cecff}
#tabs button{clip-path:none;padding:10px}
#status{border-radius:2px;background:#0c1d36;border-color:#1f4468;color:var(--accent)}
#tablewrap::before{border-radius:50%;border:2px solid #2b6c98;
  background:radial-gradient(ellipse at 50% 45%,#12335a 0,#091a31 55%,#050b17 100%);
  box-shadow:0 0 0 6px rgba(63,210,255,.08),0 0 0 7px rgba(63,210,255,.35),0 0 50px rgba(63,210,255,.25),inset 0 0 70px rgba(0,0,0,.7)}
#tablewrap::after{border-radius:50%;box-shadow:inset 0 0 0 1px rgba(63,210,255,.28);margin:30px}
#center .big{color:var(--accent);text-shadow:0 0 18px rgba(63,210,255,.7)}
#center{color:#7fb7dd}
#winner{border-color:var(--gold);color:var(--gold);box-shadow:0 0 20px rgba(240,201,92,.4)}
.pl{border-radius:4px;background:linear-gradient(160deg,rgba(18,40,72,.96),rgba(8,18,36,.96));border:0;box-shadow:inset 0 0 0 1px #24557d,inset 0 0 22px rgba(63,210,255,.08)}
.pl:hover{box-shadow:inset 0 0 0 1px #4aa9d8,inset 0 0 22px rgba(63,210,255,.14)}
.pl.cur{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 30px rgba(63,210,255,.3);animation:none}
.pl.cur::after{content:"TURN";position:absolute;left:14px;top:-19px;font-size:11px;font-weight:800;letter-spacing:.15em;color:#02202e;background:var(--accent);padding:1px 10px;border-radius:4px 4px 0 0;box-shadow:0 0 10px rgba(63,210,255,.6)}
.pl.sel{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
.pl.target{box-shadow:inset 0 0 0 2px var(--green),inset 0 0 26px rgba(70,224,160,.35)}
.pl .ph{border-radius:2px;border:1px solid #2f6f9c}
.hp{color:#ff5d73;text-shadow:0 0 8px rgba(255,93,115,.55)}
.hp .e{color:#2a2f45}
.role{border-radius:6px;padding:0 9px}
.tag{border-radius:2px;background:rgba(63,210,255,.07);border-color:#25577d}
.bubble{background:rgba(8,20,40,.96);color:var(--text);border:1px solid var(--accent);border-radius:2px;box-shadow:var(--glow)}
.bubble::after{border-top-color:var(--accent)}
.card{border-radius:5px;border:1px solid #2a5a85;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.card.ok{border:2px solid var(--accent);box-shadow:0 0 14px rgba(63,210,255,.55),0 4px 10px rgba(0,0,0,.6)}
.card.ok:hover{box-shadow:0 0 22px rgba(63,210,255,.85),0 12px 20px rgba(0,0,0,.6)}
.card.picked{border-color:var(--gold);box-shadow:0 0 22px var(--gold),0 10px 18px rgba(0,0,0,.6)}
.card:hover .info{background:var(--accent)}
.eq{border-radius:3px;border-color:#2f6f9c}
#side{background:linear-gradient(180deg,#0a1830,#060d1b);border-left:1px solid #1f4468}
#tabs{background:rgba(0,0,0,.25)}
#tabs button.on{background:rgba(63,210,255,.08);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
#log .turn{background:linear-gradient(90deg,rgba(63,210,255,.18),transparent);color:var(--accent);border-left-color:var(--accent);border-radius:0}
.th,.cc{border-radius:2px;background:rgba(18,35,63,.8)}
#bottom{background:linear-gradient(180deg,rgba(8,20,40,.96),#050b17);border-top:1px solid #1f4468;box-shadow:0 -1px 0 rgba(63,210,255,.25),0 -6px 18px rgba(0,0,0,.4)}
#bar .pr{color:var(--accent);text-shadow:0 0 8px rgba(63,210,255,.4)}
.dlg,.ci{border-radius:3px;background:linear-gradient(160deg,#13264a,#0a152b);border:1px solid #2f6f9c;box-shadow:0 0 40px rgba(63,210,255,.2),0 18px 50px rgba(0,0,0,.7)}
.dlg h3,.ci h3{color:var(--accent)}
.modal{background:rgba(2,6,14,.75)}
#prev{position:fixed;left:14px;top:66px;width:230px;background:linear-gradient(160deg,rgba(19,38,74,.97),rgba(8,18,36,.97));border:1px solid #2f6f9c;box-shadow:var(--glow),0 12px 30px rgba(0,0,0,.6);padding:10px;z-index:15;display:none;pointer-events:none}
#prev img{width:100%;border-radius:4px;display:block}
#prev h4{margin:8px 0 4px;color:var(--accent);font-size:15px}
#prev p{margin:0;font-size:13px;line-height:1.55;color:var(--text)}

/* ===== 開局設定 / 大廳 (現代風) ===== */
.dlg.setup{padding:0;width:min(920px,95vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;border-radius:14px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px 14px;border-bottom:1px solid #1b3a5a;background:linear-gradient(180deg,rgba(63,210,255,.08),transparent)}
.dh h3{margin:0;font-size:22px;letter-spacing:.08em}
.dh .x{clip-path:none;border-radius:50%;width:34px;height:34px;padding:0;background:#122440;box-shadow:inset 0 0 0 1px #2a5a85}
.dbody{overflow:auto;padding:6px 22px 14px;flex:1}
.df{display:flex;justify-content:flex-end;gap:12px;padding:14px 22px;border-top:1px solid #1b3a5a;background:rgba(0,0,0,.25)}
.df button{padding:10px 26px}
button.big{font-size:16px;font-weight:800;padding:10px 38px}
.sec{margin:16px 0 4px}
.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}

<script>
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k === "style") Object.assign(e.style, v);
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return e;
}
const S = {logN: 0, thN: 0, thoughts: [], snap: null, roster: null, roles: null, sel: null, picked: null,
           pendId: 0, multi: new Set(), lastTh: {}, logLines: 0, modalOpen: null};

let TOK = new URLSearchParams(location.search).get("tok") || "";
if (!TOK) { try { TOK = localStorage.getItem("sgs_tok") || ""; } catch (e) {} }
if (!TOK) { TOK = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }); try { localStorage.setItem("sgs_tok", TOK); } catch (e) {} }

let ROOM = new URLSearchParams(location.search).get("room") || "";
if (!ROOM) { try { ROOM = sessionStorage.getItem("sgs_room") || ""; } catch (e) {} }
async function api(path, body) {
  if (body !== undefined && body && typeof body === "object") body = Object.assign({tok: TOK, room: ROOM || "main"}, body);
  if (body === undefined && path.startsWith("/api/state")) path += "&tok=" + TOK + "&room=" + encodeURIComponent(ROOM || "main") + "&nick=" + encodeURIComponent(myNick()) + "&cm=" + (localStorage.getItem("sgs_chain") || "me");
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (j && j.gone && ROOM) leaveRoom("房間已不存在 (太久沒有人,已被刪除)");
  if (j && j.kicked && ROOM) leaveRoom("你被房主踢出了房間 (10 分鐘內不能再進入)");
  if (j && j.auth === false) showAuth(j.kicked ? "你的帳號已在另一個裝置登入,請重新登入" : "");
  return j;
}

/* ---------- 卡片元件 ---------- */
function cardEl(c, cls, onclick) {
  const col = c.color === "紅" ? "red" : "blk";
  const e = h("div", {class: "card " + col + (c.img ? "" : " noimg") + (cls ? " " + cls : ""), title: c.text || c.name});
  if (c.img) { e.append(h("img", {src: c.img, loading: "lazy"})); e.append(h("div", {class: "lab", text: c.as ? (c.as_full || c.as) + "←" + (c.real_full || c.real) : c.color + (c.nat || "") + (c.full || c.name)})); }
  else e.textContent = c.text || c.name;
  if (onclick) e.onclick = onclick;
  bindPrev(e, c);
  if (c.desc) {
    e.oncontextmenu = ev => { ev.preventDefault(); showCardInfo(c); };
  }

    close(); toast("密碼已更新", "ok");
  };
  [o, n1, n2].forEach(i => i.onkeydown = e => { if (e.key === "Enter") go(); });
  M.append(h("div", {class: "modal", style: {zIndex: 7500}, onclick: e => { if (e.target.classList.contains("modal") && !forced) close(); }}, h("div", {class: "dlg", style: {maxWidth: "400px"}},
    h("div", {class: "dh"}, h("div", {}, h("h3", {text: "🔑 修改密碼"})), h("button", {class: "x", text: forced ? "稍後" : "✕", style: forced ? {width: "auto", borderRadius: "17px", padding: "0 12px"} : {}, onclick: close})),
    h("div", {class: "dbody"},
      note ? h("div", {style: {marginBottom: "6px", lineHeight: 1.5}, text: note}) : null,
      forced ? h("div", {class: "meta", style: {color: "#ffb454"}, text: "你還在使用預設密碼 12345,任何人都能登入你的帳號,請現在改掉。"}) : null,
      o, n1, n2, err, h("button", {class: "primary", text: "更新密碼", style: {marginTop: "10px", width: "100%"}, onclick: go})))));
  setTimeout(() => (forced ? n1 : o).focus(), 50);
}
function uploadAvatar(file) {   // 縮成 128x128 JPEG (置中裁切) 再上傳
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast("請選擇圖片檔"); return; }
  if (file.size > 5 * 1024 * 1024) { toast("圖片太大了 (" + (file.size / 1048576).toFixed(1) + " MB),上限 5 MB"); return; }   // 檔案大小上限
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = async () => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const m = Math.min(img.width, img.height), ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 128, 128);
    ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 128, 128);
    URL.revokeObjectURL(url);
    const r = await api("/api/avatar", {data: c.toDataURL("image/jpeg", 0.85)});
    if (r.ok) { toast("大頭貼已更新"); await loadProfile(); showProfile(); } else toast("上傳失敗: " + (r.error || ""));
  };
  img.onerror = () => toast("無法讀取這張圖片");
  img.src = url;
}

async function showBoard() {
  const M = $("#modal"); S.modalOpen = "board"; M.textContent = "";
  const close = () => { M.textContent = ""; S.modalOpen = null; };
  const r = await (await fetch("/api/leaderboard?tok=" + encodeURIComponent(TOK))).json();
  const rows = r.rows || [];
  const rate = x => x.games ? x.wins / x.games : 0;
  const SORTS = {"段位": (a, b) => (b.rp || 0) - (a.rp || 0) || b.wins - a.wins, "勝場": (a, b) => b.wins - a.wins || (b.rp || 0) - (a.rp || 0), "勝率": (a, b) => rate(b) - rate(a) || b.games - a.games};
  let key = "段位";
  const body = h("div", {class: "dbody"}), tabs = h("div", {style: {display: "flex", gap: "6px", marginBottom: "8px"}});
  const draw = () => {
    tabs.textContent = ""; body.textContent = "";
    for (const k of Object.keys(SORTS)) tabs.append(h("button", {text: "依" + k, class: k === key ? "primary" : "", onclick: () => { key = k; draw(); }}));
    body.append(tabs);
    if (!rows.length) body.append(h("div", {class: "meta", text: "還沒有玩家資料"}));
    const line = (x, i) => h("div", {style: {display: "flex", alignItems: "center", gap: "10px", padding: "6px 4px", borderBottom: "1px solid #17304f", background: x.me ? "#12335a" : ""}},
      h("span", {style: {width: "28px", textAlign: "center", fontWeight: 700, color: i < 3 ? "#ffd24a" : "#8fb4d8"}, text: i < 3 ? ["🥇", "🥈", "🥉"][i] : String(i + 1)}),
      avEl(x.avatar, x.style, {style: {width: "32px", height: "32px", borderRadius: "50%", objectFit: "cover"}}),
      h("span", {style: {flex: 1}}, h("div", {}, x.name, devEl(x.dev))),
      h("span", {style: {textAlign: "right"}}, h("div", {}, rkEl(x.lv), h("span", {class: "meta", text: " " + (x.rp || 0) + " 分"})),
        h("div", {class: "meta", text: x.games ? `${x.wins} 勝 / ${x.games} 場 · ${Math.round(rate(x) * 100)}%` : "尚無對局"})));
    const sorted = rows.slice().sort(SORTS[key]);
    sorted.slice(0, 10).forEach((x, i) => body.append(line(x, i)));
    const mi = sorted.findIndex(x => x.me);
    if (mi >= 10) body.append(h("div", {class: "meta", style: {textAlign: "center", padding: "2px"}, text: "⋮"}), line(sorted[mi], mi));
  };
  M.append(h("div", {class: "modal", onclick: e => { if (e.target.classList.contains("modal")) close(); }}, h("div", {class: "dlg", style: {maxWidth: "460px"}},
    h("div", {class: "dh"}, h("div", {}, h("h3", {text: "玩家排行榜"})), h("button", {class: "x", text: "✕", onclick: close})), body)));
  draw();
}

let AUTH_MODE = "login";
function setAuthMode(m) {

  $("#auser").placeholder = m === "reg" ? "設定使用者名稱 (2~10 字)" : "使用者名稱 或 UID";
  $("#apw").placeholder = m === "reg" ? "設定密碼 (4 字以上,留空 = 預設 12345)" : "密碼";
  $("#apw").autocomplete = m === "reg" ? "new-password" : "current-password";

}
function showAuth(msg) { $("#auth").classList.add("on"); $("#authmsg").textContent = msg || "請登入或註冊後開始遊戲"; }
async function submitAuth() {
  const user = $("#auser").value.trim(), pw = $("#apw").value;
  const r = await (await fetch(AUTH_MODE === "reg" ? "/api/register" : "/api/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({user, pw, tok: TOK})})).json();
  if (!r.ok) { $("#aerr").textContent = r.error || "失敗"; return; }

  try { if (r.via_uid) sessionStorage.setItem("sgs_via_uid", r.user); } catch (e) {}   // 用 UID 登入的: 進去後提醒改用帳號
  try { localStorage.setItem("sgs_tok", r.tok); localStorage.removeItem("sgs_theme"); localStorage.setItem("nick", r.user.slice(0, 10)); } catch (e) {}

function resetRoomState() {
