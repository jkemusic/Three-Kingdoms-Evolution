name: Build desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build server (PyInstaller)
        run: |
          python -m pip install pyinstaller pillow
          python -m PyInstaller sgs_server.spec --noconfirm --distpath dist --workpath build
      - name: Build desktop app (Electron)
        working-directory: electron
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            electron/release/*.exe
            electron/release/*.dmg
            electron/release/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/release/*.exe
            electron/release/*.dmg
            electron/release/*.zip
          body_path: CHANGELOG.md
